name: Deploy

# Auto-deploys to the production server on every push to master, or on
# demand from the Actions tab. The runner checks out the code (using its
# own automatic GitHub auth - no credentials needed) and copies it to the
# server over SCP, then SSHes in just to install/build/restart. The server
# itself never talks to GitHub, so it can't hit the "could not read
# Username for https://github.com" auth failure a server-side `git fetch`
# was running into.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy source to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,!backend/node_modules,!frontend/node_modules"
          target: /var/www/app
          overwrite: true

      - name: Install, build & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/app

            echo "--- backend ---"
            cd backend
            npm install
            npm run build

            echo "--- frontend ---"
            cd ../frontend
            npm install
            npx vite build

            echo "--- restart ---"
            pm2 restart app-backend

            echo "Deploy complete: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            # Deliberately NOT run here: `prisma db push`. This project's
            # DATABASE_URL is Supabase's pooled (pgbouncer) connection string,
            # which schema-push operations don't handle well (it hangs - see
            # the deploy history for this repo). If a change touches
            # prisma/schema.prisma, push the schema from a machine using the
            # direct (non-pooled) connection string before merging, or run
            # `npx prisma db push` by hand from a shell that has it.
